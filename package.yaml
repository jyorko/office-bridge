spec-version: v2
name: desktop-office
description: Local Outlook actions and isolated background Teams automation.
version: 0.1.0
dependencies:
  conda-forge:
    - python=3.12.11
  pypi:
    - actions-core=1.1.0
    - markdown-it-py=4.3.0
    - pydantic=2.14.3
    - robocorp-browser=2.4.0
    - actions-runtime=1.1.1
    - pyyaml=6.0.3
    - pytest=9.0.3
    - ruff=0.8.6
    - tomlkit=0.15.2

pythonpath:
  - src
dev-tasks:
  test: python -m pytest tests -q
  lint: ruff check src scripts tests
  format: ruff format src scripts tests
  format-check: ruff format --check src scripts tests
  test-edit: python -m pytest tests/test_teams_web_dom.py tests/test_teams_message_edit.py -q
  test-evidence: python -m pytest tests/test_evidence.py -q
  test-copilot: python -m pytest tests/test_copilot.py tests/test_copilot_dom.py -q
  test-outlook: python -m pytest tests/test_outlook_account_surface.py tests/test_outlook_mail_dom.py tests/test_outlook_models.py tests/test_outlook_observed_items.py tests/test_outlook_response_probe.py tests/test_outlook_send_ledger.py tests/test_outlook_web_routing.py -q
  prepare: python scripts/prepare_state.py
  prepare-dev: python scripts/prepare_state.py --dev
  serve: python scripts/run_server.py
  serve-dev: python scripts/run_server.py --dev
  stop-host: python scripts/stop_teams_session.py
  reload-teams: python scripts/restart_teams_session.py
  reload-outlook: python scripts/restart_outlook_session.py
  run-outlook-session: python scripts/run_outlook_supervisor.py
  stop-outlook-host: python scripts/stop_outlook_session.py
  install-skills: python scripts/install_user_skills.py
  verify: python scripts/bootstrap_check.py
  verify-dev: python scripts/bootstrap_check.py --dev
  complete-startup: python scripts/complete_startup.py
  complete-startup-dev: python scripts/complete_startup.py --dev
  verify-teams-dev: python scripts/verify_teams_web.py --dev --count 2
  verify-canvas: python scripts/verify_canvas.py
  register: python scripts/register_mcp.py
  register-dev: python scripts/register_mcp.py --dev
  export-openapi: python scripts/export_openapi.py
  install-browser: python -c "from robocorp import browser; browser.install('chromium')"
  install-webview2: python -m office_bridge.runtime.sdk
packaging:
  exclude:
    - ./.git/**
    - ./docs/**
    - ./scripts/**
    - ./powershell/**
    - ./tests/**
    - ./design/**
    - ./.venv/**
    - ./.runtime/**
    - ./.package/**
    - ./.action-server/**
    - ./.state/**
    - ./logs/**
    - ./devdata/**
    - ./**/__pycache__/**
    - ./.pytest_cache/**
    - ./.ruff_cache/**
