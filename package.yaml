spec-version: v2
name: desktop-office
description: Local Outlook actions and isolated background Teams automation.
version: 0.1.0
dependencies:
  conda-forge:
    - python=3.12.11
  pypi:
    - actions-core=1.0.3
    - pydantic=2.14.3
    - robocorp-browser=2.4.0
    # - playwright=1.65.1
pythonpath:
  - src
dev-dependencies:
  pypi:
    - pytest=8.3.5
    - ruff=0.8.6
dev-tasks:
  test: python -m pytest tests -q
  lint: ruff check src scripts tests
  format: ruff format src scripts tests
  install-browser: python -c "from robocorp import browser; browser.install('chromium')"
  install-webview2: python -m office_bridge.runtime.sdk
packaging:
  exclude:
    - ./.git/**
    - ./docs/**
    - ./scripts/**
    - ./powershell/**
    - ./tests/**
    - ./design/**
    - ./.venv/**
    - ./.runtime/**
    - ./.package/**
    - ./.action-server/**
    - ./.state/**
    - ./logs/**
    - ./devdata/**
    - ./**/__pycache__/**
    - ./.pytest_cache/**
    - ./.ruff_cache/**
