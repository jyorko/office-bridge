<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Office Bridge</title>
    <style>
      :root {
        color-scheme: light dark;
        --ink: var(--foreground, CanvasText);
        --sub: var(--muted-foreground, light-dark(#47586b, #adbbca));
        --line: var(--border, light-dark(#cad7df, #374452));
        --sheet: var(--card, light-dark(#fff, #18232e));
        --blue: light-dark(#076c91, #7cd8f4);
        --violet: light-dark(#7057b3, #bca9fb);
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        color: var(--ink);
        font:
          15px/1.5 Inter,
          var(--font-sans, "Segoe UI"),
          system-ui,
          sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      main {
        display: grid;
        gap: 13px;
        min-width: 0;
        overflow-wrap: anywhere;
      }
      p,
      h1,
      h2,
      dl,
      dd {
        margin: 0;
      }
      .mast {
        --hue: 198;
        isolation: isolate;
        position: relative;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        min-height: 124px;
        padding: 22px 28px;
        overflow: hidden;
        border-radius: 16px;
        color: #f5fcff;
        background:
          radial-gradient(ellipse at 86% -30%, hsl(var(--hue) 77% 40%) 0, transparent 65%),
          linear-gradient(112deg, hsl(var(--hue) 61% 13%), hsl(var(--hue) 70% 22%));
        box-shadow:
          inset 0 1px 0 #ffffff28,
          inset 0 -1px 0 #0003;
      }
      .mast::before {
        content: "";
        z-index: -1;
        pointer-events: none;
        position: absolute;
        inset: 0 0 0 53%;
        background: repeating-linear-gradient(
          -51deg,
          transparent 0 29px,
          #d2faff0a 30px,
          transparent 31px 49px
        );
        mask-image: linear-gradient(to right, transparent, #000);
      }
      .mast.teams {
        --hue: 254;
      }
      .mast.receipt {
        --hue: 165;
      }
      .mast-copy {
        min-width: 0;
        z-index: 1;
      }
      .source {
        display: flex;
        align-items: center;
        gap: 8px;
        color: #e1eff5;
        font-size: 12px;
        font-weight: 600;
        letter-spacing: 0.025em;
      }
      .source::before {
        content: "";
        width: 12px;
        height: 12px;
        background: conic-gradient(from 90deg, #7dd6f4 0 25%, #2086ae 0 50%, #52b3d8 0 75%, #b2eaff 0);
        clip-path: polygon(
          0 0,
          45% 0,
          45% 45%,
          0 45%,
          0 0,
          55% 0,
          100% 0,
          100% 45%,
          55% 45%,
          55% 0,
          55% 55%,
          100% 55%,
          100% 100%,
          55% 100%,
          55% 55%,
          45% 55%,
          45% 100%,
          0 100%,
          0 55%,
          45% 55%
        );
      }
      h1 {
        margin-top: 5px;
        font-size: clamp(26px, 4.3vw, 36px);
        font-weight: 630;
        letter-spacing: -0.045em;
        line-height: 1.14;
        text-wrap: balance;
      }
      .scope {
        margin-top: 8px;
        color: #d1e5ec;
        font-size: 12px;
        line-height: 1.5;
      }
      /* A folded envelope, threaded replies, or a stamped receipt gives each source a distinct silhouette. */
      .glyph {
        position: relative;
        flex: 0 0 105px;
        height: 82px;
        margin-right: 5px;
        filter: drop-shadow(0 9px 7px #0004);
        transform: rotate(-9deg) skewY(1deg);
      }
      .glyph i {
        position: absolute;
        display: block;
      }
      .back {
        inset: 13% 0 0;
        background: linear-gradient(135deg, #7fd9f5, #126996);
        clip-path: polygon(0 37%, 52% 0, 100% 28%, 100% 100%, 0 100%);
      }
      .paper {
        inset: 13% 13% 15%;
        transform: rotate(8deg);
        border-radius: 4px;
        background: linear-gradient(100deg, #fff, #c5edfa);
        box-shadow: 0 0 0 1px #fff7;
      }
      .paper::after {
        content: "";
        position: absolute;
        inset: 18% 20% 28%;
        background: repeating-linear-gradient(to bottom, #448ba98a 0 2px, transparent 2px 8px);
      }
      .front {
        inset: 41% 0 0;
        border-radius: 0 0 6px 6px;
        clip-path: polygon(0 0, 51% 53%, 100% 0, 100% 100%, 0 100%);
        background: conic-gradient(
          from 227deg at 51% 53%,
          #84d5ef 0 23%,
          #51b9df 0 50%,
          #9ae6fa 0 75%,
          #4cacca 0
        );
        box-shadow: inset 0 -2px 1px #afebffb3;
      }
      .teams .back,
      .teams .front {
        clip-path: polygon(0 0, 100% 0, 100% 79%, 30% 79%, 11% 100%, 11% 79%, 0 79%);
        border-radius: 9px;
      }
      .teams .back {
        inset: 7% 0 25% 21%;
        background: linear-gradient(135deg, #ded1ff, #8f7cce);
      }
      .teams .paper {
        display: none;
      }
      .teams .front {
        inset: 27% 17% 0 0;
        background: linear-gradient(135deg, #bdadff, #8770d5);
      }
      .teams .front::after {
        content: "";
        position: absolute;
        inset: 27% 19% 41%;
        border-block: 3px solid #4e398f;
      }
      .receipt .back {
        inset: 10% 13% 0 22%;
        clip-path: none;
        border-radius: 5px;
        background: #48ab99;
        transform: rotate(10deg);
      }
      .receipt .paper {
        inset: 4% 19% 4% 13%;
        transform: none;
        background: linear-gradient(120deg, #fff, #c1f6e3);
        clip-path: polygon(
          0 0,
          100% 0,
          100% 97%,
          88% 92%,
          77% 100%,
          65% 92%,
          52% 100%,
          40% 92%,
          27% 100%,
          14% 92%,
          0 99%
        );
      }
      .receipt .paper::after {
        inset: 19% 18% 44%;
        background: repeating-linear-gradient(to bottom, #5b9e8a 0 2px, transparent 2px 8px);
      }
      .receipt .front {
        inset: auto 9% 4% auto;
        width: 34px;
        height: 34px;
        clip-path: none;
        border-radius: 50%;
        background: linear-gradient(145deg, #a9f4d2, #4bc899);
        box-shadow: 0 2px 6px #064b4580;
      }
      .receipt .front::after {
        content: "";
        display: block;
        width: 13px;
        height: 6px;
        margin: 10px auto;
        border: solid #075c4b;
        border-width: 0 0 3px 3px;
        transform: rotate(-45deg);
      }
      .rows {
        display: grid;
        min-width: 0;
        overflow: hidden;
        background: var(--sheet);
        border: 1px solid var(--line);
        border-radius: 14px;
        box-shadow: 0 4px 12px #1026330b;
      }
      article {
        position: relative;
        min-width: 0;
        padding: 18px 21px;
      }
      article + article {
        border-top: 1px solid var(--line);
      }
      article:has(.mail-row) {
        padding: 0;
      }
      article[data-unread="true"] {
        box-shadow: inset 3px 0 var(--blue);
      }
      .row-head {
        display: flex;
        align-items: baseline;
        flex-wrap: wrap;
        gap: 3px 12px;
        color: var(--sub);
        font-size: 12px;
      }
      .row-head:empty {
        display: none;
      }
      .detail {
        font-weight: 600;
        color: var(--ink);
      }
      .when {
        margin-left: auto;
        font-variant-numeric: tabular-nums;
        font-size: 11.5px;
      }
      .unread {
        color: var(--blue);
        font-size: 11px;
        font-weight: 700;
      }
      .unread::before {
        content: "";
        display: inline-block;
        width: 6px;
        height: 6px;
        border-radius: 50%;
        margin-right: 5px;
        vertical-align: 1px;
        background: currentColor;
      }
      h2 {
        font-size: 17px;
        font-weight: 600;
        letter-spacing: -0.025em;
        line-height: 1.35;
      }
      .row-head:not(:empty) + h2 {
        margin-top: 4px;
      }
      .mail-row summary {
        position: relative;
        list-style: none;
        padding: 15px 41px 15px 21px;
      }
      .mail-row summary::-webkit-details-marker {
        display: none;
      }
      .mail-row summary::after {
        content: "";
        position: absolute;
        right: 19px;
        top: calc(50% - 4px);
        width: 7px;
        height: 7px;
        border: solid var(--sub);
        border-width: 0 1.5px 1.5px 0;
        transform: rotate(-45deg);
      }
      .mail-row[open] summary::after {
        transform: rotate(45deg);
      }
      .mail-row[open],
      .mail-row summary:hover {
        background: color-mix(in srgb, var(--blue) 5%, var(--sheet));
      }
      .expanded {
        padding: 0 21px 17px;
      }
      summary,
      .filter,
      button {
        cursor: pointer;
      }
      .filter,
      button {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        width: fit-content;
        min-height: 44px;
        padding: 6px 14px;
        border-radius: 9px;
        border: 1px solid var(--line);
        color: var(--ink);
        background: var(--sheet);
        font-family: inherit;
        font-size: 13px;
        font-weight: 600;
        line-height: 1.4;
      }
      .filter {
        font-size: 13px;
        font-weight: 600;
      }
      .filter input {
        margin: 0;
        accent-color: var(--blue);
        width: 16px;
        height: 16px;
      }
      .count {
        color: var(--blue);
        font-variant-numeric: tabular-nums;
      }
      .filter:has(:checked) {
        border-color: var(--blue);
      }
      main:has(.filter input:checked) article:not([data-unread="true"]) {
        display: none;
      }
      .chat {
        display: grid;
        grid-template-columns: 36px minmax(0, 1fr);
        gap: 12px;
      }
      .avatar {
        display: grid;
        place-items: center;
        align-self: start;
        min-height: 36px;
        border-radius: 12px;
        color: var(--violet);
        background: color-mix(in srgb, var(--violet) 13%, var(--sheet));
        font-weight: 650;
        font-size: 12px;
        letter-spacing: 0.02em;
      }
      .chat h2 {
        font-size: 15px;
      }
      .chat .when {
        float: right;
      }
      .chat .row-head {
        float: right;
        margin: 0 0 3px 12px;
      }
      .chat .body,
      .chat .preview {
        margin-top: 4px;
        clear: both;
      }
      .receipt .body {
        border-top: 1px solid var(--line);
        padding-top: 12px;
      }
      .body,
      .preview {
        margin-top: 12px;
        white-space: pre-wrap;
        line-height: 1.65;
      }
      .mail-body {
        white-space: normal;
        max-width: 85ch;
        overflow-x: auto;
      }
      .mail-body p { margin: 0 0 0.8em; }
      .mail-body p:last-child { margin-bottom: 0; }
      .mail-body ul, .mail-body ol { margin: 0.7em 0; padding-left: 1.6em; }
      .mail-body li { margin: 0.25em 0; }
      .mail-body table {
        width: 100%;
        border-collapse: collapse;
        margin: 1em 0;
        font-size: 13px;
        line-height: 1.45;
      }
      .mail-body td, .mail-body th {
        padding: 10px 12px;
        border: 1px solid var(--line);
        text-align: left;
        vertical-align: top;
        min-width: 6em;
      }
      .mail-body th, .mail-body thead {
        background: color-mix(in srgb, var(--blue) 8%, var(--sheet));
        font-weight: 650;
      }
      .mail-body td p, .mail-body th p { margin: 0 0 0.4em; }
      .mail-body blockquote { margin: 1em 0; padding-left: 1em; border-left: 3px solid var(--line); }
      .mail-body h1, .mail-body h2, .mail-body h3, .mail-body h4 {
        margin: 1em 0 0.4em;
        font-size: 1.1em;
        letter-spacing: normal;
      }
      .mail-body pre { white-space: pre-wrap; }
      .mast.outlook, .mast.receipt { min-height: 90px; padding-block: 16px; }
      .mast.outlook .glyph, .mast.receipt .glyph { flex-basis: 72px; height: 60px; }
      .mast.outlook h1, .mast.receipt h1 { font-size: 27px; }
      .preview {
        color: var(--sub);
      }
      article:has(.disclosure[open]) .preview {
        display: none;
      }
      .disclosure summary {
        padding: 11px 0;
        min-height: 44px;
        color: var(--blue);
        font-size: 13px;
        font-weight: 650;
      }
      .disclosure .body {
        margin: 0;
      }
      .note,
      .empty {
        color: var(--sub);
        font-size: 13px;
      }
      .note {
        margin-top: 8px;
      }
      .empty {
        padding: 20px;
      }
      dl {
        display: grid;
        grid-template-columns: max-content minmax(0, 1fr);
        gap: 3px 14px;
        font-size: 13px;
        margin-top: 10px;
      }
      dt {
        color: var(--sub);
      }
      .expanded dl {
        margin: 0;
      }
      summary:focus-visible,
      button:focus-visible,
      .filter:focus-within {
        outline: 2px solid var(--ring, var(--blue));
        outline-offset: -3px;
      }
      #window-action:empty {
        display: none;
      }
      #window-action {
        margin-top: 10px;
      }
      .mail-actions, .composer-actions {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin-top: 12px;
      }
      .mail-row + .mail-actions {
        margin: 0;
        padding: 0 21px 13px;
      }
      .mail-actions button, .primary-action {
        color: var(--blue);
        background: color-mix(in srgb, var(--blue) 7%, var(--sheet));
      }
      .composer {
        margin-top: 16px;
        border-top: 1px solid var(--line);
        padding-top: 14px;
      }
      .composer label { display: block; font-weight: 600; }
      .composer textarea {
        display: block;
        width: 100%;
        margin-top: 6px;
        padding: 10px 12px;
        resize: vertical;
        font: inherit;
        color: var(--ink);
        background: var(--sheet);
        border: 1px solid var(--line);
        border-radius: 8px;
      }
      #action-status:not(:empty) {
        margin: 12px 0;
        padding: 12px 16px;
        border: 1px solid var(--line);
        border-radius: 10px;
        color: var(--ink);
        background: var(--sheet);
        font-size: 13px;
        line-height: 1.6;
      }
      button {
        font-family: inherit;
        font-weight: 600;
      }
      button:disabled {
        opacity: .6;
        cursor: default;
      }
      @media (max-width: 480px) {
        .mast {
          min-height: 110px;
          padding: 18px;
        }
        .glyph {
          flex-basis: 70px;
          height: 60px;
          margin-right: 0;
        }
        .when {
          margin-left: 0;
        }
        .row-head {
          gap: 3px 8px;
        }
        .chat .row-head {
          float: none;
          margin: 0;
        }
        .chat {
          gap: 8px;
          grid-template-columns: 28px minmax(0, 1fr);
        }
        .avatar {
          min-height: 28px;
          border-radius: 9px;
        }
        article {
          padding: 14px;
        }
        .mail-row summary {
          padding-left: 15px;
        }
        .source {
          font-size: 11.5px;
        }
      }
      @media (hover: hover) and (prefers-reduced-motion: no-preference) {
        .paper {
          transition: translate 0.2s ease-out;
        }
        .mast:hover .paper {
          translate: 0 -3px;
        }
        .mail-row summary {
          transition: background-color 0.14s;
        }
      }
    </style>
  </head>
  <body>
    <main id="messages" aria-label="Office messages"><!--messages--></main>
    <div id="window-action"></div>
    <p id="action-status" role="status"></p>
    <!--host-->
  </body>
</html>
